<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Tema: aplica antes de qualquer render/paint para não "flashar" dark ao carregar no claro -->
    <script>
      (function () {
        var saved = localStorage.getItem('theme');
        var isLight = saved
          ? saved === 'light'
          : window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
        if (isLight) document.documentElement.classList.add('theme-light');
      })();
    </script>

    <!-- PWA: o Chrome dispara beforeinstallprompt ~400ms após o carregamento, quando
         ainda estamos na Landing e nenhum componente React montou. Capturar aqui, antes
         do bundle, garante que o evento não se perca — ele é único por carregamento.
         src/lib/pwaInstall.js lê este objeto; sdd:install-change avisa a UI. -->
    <script>
      (function () {
        var bus = { event: null, installed: false };
        window.__sddInstall = bus;
        function aviso() { window.dispatchEvent(new Event('sdd:install-change')); }
        window.addEventListener('beforeinstallprompt', function (e) {
          e.preventDefault();
          bus.event = e;
          aviso();
        });
        window.addEventListener('appinstalled', function () {
          bus.installed = true;
          bus.event = null;
          aviso();
        });
      })();
    </script>

    <title>SaiDaDívida — Controle financeiro inteligente</title>
    <meta name="description" content="Gerencie sua renda, controle seus gastos e quite suas dívidas com planejamento inteligente." />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#3b82f6" />

    <!-- Ícone padrão -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- iOS (iPhone/iPad) -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SaiDaDívida" />
    <!-- Safari só aceita PNG aqui; com SVG o iOS cai num ícone genérico -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph (preview ao compartilhar link) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="SaiDaDívida — Controle financeiro inteligente" />
    <meta property="og:description" content="Gerencie sua renda, controle seus gastos e quite suas dívidas de vez." />
    <meta property="og:url" content="https://saidadivida2.vercel.app" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </body>
</html>
